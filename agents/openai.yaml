interface:
  display_name: "Vertical OS builder"
  short_description: "Clone Banking or Retail OS for another industry"
  default_prompt: "Use $vertical-os-builder for the vertical and target environment/workspace I specify. Clone Banking or Retail OS, preserve spheres, alignment and reusable flows, research the industry architecture, and keep real demo journeys as separate tasks. Include Tower and Retail's company-wide Work overview with department pulse cards, work list, composable filters, viewer scope and preserved navigation context; clearly label illustrative activity as a Demo snapshot without changing journey readiness or requiring flow drill-downs. Allocate unique agents by business importance and workflow breadth, not equal department quotas: core business gets a clear majority, primary core departments are at least twice individual support departments by default, and HR is smaller than every core department. Document counts and rationale without inventing roles. Render complete unclipped names and colorful agent spheres, including Planned roles. Preserve Retail's full Tower connector CSS cascade: thin accent-colored curves, subtle glow and matching dots. Reveal lines and slow connection dots only for a hovered or clicked/selected agent; preserve truthful status, reduced motion and hidden-view suspension. Include a top-right Light/Dark control, default to Light, remember the choice across reloads, and theme all app views consistently without changing the host theme or starting idle connection motion."
