interface:
  display_name: "Vertical OS builder"
  short_description: "Clone Banking or Retail OS for another industry"
  default_prompt: "Use $vertical-os-builder for the vertical and target environment/workspace I specify. Clone Banking or Retail OS, preserve spheres, alignment and reusable flows, research the industry architecture, and keep real demo journeys as separate tasks. Render complete unclipped names and colorful agent spheres, including Planned roles. On the Agents page, reveal lines and slow connection dots only for a hovered or clicked/selected agent; preserve truthful status and reduced motion. Include a top-right Light/Dark control, default to Light, remember the choice across reloads, and theme all app views consistently without changing the host theme or starting idle connection motion."
